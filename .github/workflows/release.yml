name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: sshm
  BIN_NAME: sshm

jobs:
  release:
    name: Publish crate and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      version: ${{ steps.metadata.outputs.version }}
      should_upload_assets: ${{ steps.assets.outputs.should_upload_assets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if ! version="$(cargo metadata --format-version=1 --no-deps | jq -er --arg name "${PACKAGE_NAME}" '[.packages[] | select(.name == $name) | .version][0]')"; then
            echo "package ${PACKAGE_NAME} not found in cargo metadata" >&2
            exit 1
          fi

          {
            echo "release_tag=v${version}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check release assets
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail

          expected_assets=(
            "${BIN_NAME}-${RELEASE_TAG}-linux-amd64.zip"
            "${BIN_NAME}-${RELEASE_TAG}-linux-arm64.zip"
            "${BIN_NAME}-${RELEASE_TAG}-macos-amd64.zip"
            "${BIN_NAME}-${RELEASE_TAG}-macos-arm64.zip"
            "${BIN_NAME}-${RELEASE_TAG}-windows-amd64.zip"
          )

          should_upload_assets="false"
          release_exists="false"
          existing_assets="$(mktemp)"

          for _ in {1..6}; do
            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > "${existing_assets}" 2>/dev/null; then
              release_exists="true"
              break
            fi
            sleep 2
          done

          if [[ "${release_exists}" == "true" ]]; then
            for asset in "${expected_assets[@]}"; do
              if ! grep -Fxq "${asset}" "${existing_assets}"; then
                echo "missing release asset: ${asset}"
                should_upload_assets="true"
              fi
            done
          else
            echo "release ${RELEASE_TAG} does not exist yet, skipping asset upload"
          fi

          echo "should_upload_assets=${should_upload_assets}" >> "${GITHUB_OUTPUT}"

  release-pr:
    name: Open or update Release-plz PR
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-assets:
    name: Build ${{ matrix.target }}
    needs: release
    if: ${{ needs.release.outputs.should_upload_assets == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-amd64
            binary_suffix: ""

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64
            binary_suffix: ""

          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-amd64
            binary_suffix: ""

          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64
            binary_suffix: ""

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-amd64
            binary_suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked --verbose

      - name: Resolve package paths
        id: package
        shell: bash
        env:
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          binary="${BIN_NAME}${BINARY_SUFFIX}"
          archive="${BIN_NAME}-${RELEASE_TAG}-${PLATFORM}.zip"

          {
            echo "archive=${archive}"
            echo "binary_path=target/${TARGET}/release/${binary}"
          } >> "${GITHUB_OUTPUT}"

      - name: Strip binary
        if: matrix.os != 'windows-latest'
        run: strip "${{ steps.package.outputs.binary_path }}"

      - name: Create release archive (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          zip -j "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.binary_path }}"

      - name: Create release archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ steps.package.outputs.binary_path }}" `
            -DestinationPath "${{ steps.package.outputs.archive }}" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  upload-release-assets:
    name: Upload GitHub Release assets
    needs: [release, build-assets]
    if: ${{ needs.release.outputs.should_upload_assets == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          files: dist/*
          overwrite_files: true
